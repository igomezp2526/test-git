<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo HTML Gabriel Cambio</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }

      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }

      h1 {
        color: #2563eb;
        margin-bottom: 16px;
      }

      p {
        line-height: 1.6;
      }

      .lista {
        margin-top: 20px;
        padding-left: 20px;
      }

      .lista li {
        margin-bottom: 10px;
      }

      .boton {
        display: inline-block;
        margin-top: 20px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Html de ejemplo</h1>
        <p>
          Esta es una página sencilla creada con HTML y CSS para mostrar un
          ejemplo básico de estructura y estilo.
        </p>

        <ul class="lista">
          <li>Encabezado con título principal.</li>
          <li>Sección con texto descriptivo.</li>
          <li>Lista con elementos simples.</li>
          <li>Botón de acción visual.</li>
        </ul>

        <a class="boton" href="#">Acción de ejemplo</a>
      </section>
    </main>
  </body>
</html>
